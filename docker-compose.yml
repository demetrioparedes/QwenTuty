version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: erp_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_DB=erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - erp-net

  finance:
    container_name: finance_service
    build: ./src/finance
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src/finance:/app
    ports:
      - "8001:8000"
    env_file:
      - ./src/finance/.env
    depends_on:
      - db
      - rabbitmq
    networks:
      - erp-net

etworks:
  erp-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
